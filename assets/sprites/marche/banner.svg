<svg xmlns="http://www.w3.org/2000/svg" width="128" height="40" viewBox="0 0 128 40" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- Matin de marché : ciel bleu clair -->
  <rect x="0" y="0" width="128" height="40" fill="#41a6f6"/>
  <rect x="0" y="0" width="128" height="5" fill="#3b5dc9"/>
  <rect x="0" y="5" width="128" height="5" fill="#41a6f6"/>
  <rect x="0" y="10" width="128" height="6" fill="#73eff7"/>

  <!-- Soleil du matin -->
  <rect x="8" y="4" width="6" height="5" fill="#ffcd75"/>
  <rect x="9" y="5" width="4" height="3" fill="#fff2c8"/>

  <!-- Nuages -->
  <rect x="44" y="4" width="10" height="2" fill="#f4f4f4"/>
  <rect x="48" y="3" width="4" height="1" fill="#f4f4f4"/>
  <rect x="92" y="7" width="8" height="2" fill="#f4f4f4"/>

  <!-- Place du marché (pavés) -->
  <rect x="0" y="16" width="128" height="24" fill="#94b0c2"/>
  <rect x="0" y="16" width="128" height="1" fill="#f4f4f4"/>
  <rect x="10" y="22" width="2" height="1" fill="#566c86"/>
  <rect x="30" y="27" width="2" height="1" fill="#566c86"/>
  <rect x="55" y="24" width="2" height="1" fill="#566c86"/>
  <rect x="90" y="28" width="2" height="1" fill="#566c86"/>
