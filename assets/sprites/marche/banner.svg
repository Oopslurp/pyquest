  <rect x="36" y="28" width="1" height="3" fill="#333c57"/>
  <rect x="39" y="28" width="1" height="3" fill="#333c57"/>

  <!-- Cliente avec panier -->
  <rect x="84" y="21" width="3" height="1" fill="#5d275d"/>
  <rect x="84" y="22" width="3" height="2" fill="#ffcd75"/>
  <rect x="83" y="24" width="5" height="4" fill="#b13e53"/>
  <rect x="88" y="26" width="2" height="2" fill="#ffcd75"/>
  <rect x="84" y="28" width="1" height="3" fill="#333c57"/>
  <rect x="86" y="28" width="1" height="3" fill="#333c57"/>
