  <!-- Grand étal central (auvent rayé rouge/blanc) -->
  <rect x="46" y="12" width="28" height="1" fill="#b13e53"/>
  <rect x="46" y="13" width="4" height="3" fill="#b13e53"/>
  <rect x="50" y="13" width="4" height="3" fill="#f4f4f4"/>
  <rect x="54" y="13" width="4" height="3" fill="#b13e53"/>
  <rect x="58" y="13" width="4" height="3" fill="#f4f4f4"/>
  <rect x="62" y="13" width="4" height="3" fill="#b13e53"/>
  <rect x="66" y="13" width="4" height="3" fill="#f4f4f4"/>
  <rect x="70" y="13" width="4" height="3" fill="#b13e53"/>
  <rect x="46" y="16" width="2" height="14" fill="#566c86"/>
  <rect x="72" y="16" width="2" height="14" fill="#566c86"/>
  <rect x="48" y="24" width="24" height="1" fill="#ffcd75"/>
  <rect x="48" y="25" width="24" height="6" fill="#ef7d57"/>
  <rect x="50" y="22" width="4" height="2" fill="#a7f070"/>
  <rect x="56" y="22" width="4" height="2" fill="#b13e53"/>
  <rect x="62" y="22" width="4" height="2" fill="#ffcd75"/>
  <rect x="68" y="22" width="3" height="2" fill="#38b764"/>

  <!-- Étal secondaire gauche (auvent vert) -->
  <rect x="8" y="15" width="20" height="1" fill="#257179"/>
  <rect x="8" y="16" width="4" height="2" fill="#38b764"/>
  <rect x="12" y="16" width="4" height="2" fill="#a7f070"/>
  <rect x="16" y="16" width="4" height="2" fill="#38b764"/>
  <rect x="20" y="16" width="4" height="2" fill="#a7f070"/>
  <rect x="24" y="16" width="4" height="2" fill="#38b764"/>
  <rect x="8" y="18" width="2" height="12" fill="#566c86"/>
  <rect x="26" y="18" width="2" height="12" fill="#566c86"/>
  <rect x="10" y="25" width="16" height="5" fill="#ef7d57"/>
  <rect x="10" y="24" width="16" height="1" fill="#ffcd75"/>

  <!-- Cageots empilés à droite -->
  <rect x="100" y="28" width="12" height="6" fill="#ef7d57"/>
