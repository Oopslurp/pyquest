<svg xmlns="http://www.w3.org/2000/svg" width="128" height="40" viewBox="0 0 128 40" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- L'Arène des Algorithmes, fin d'après-midi -->
  <rect x="0" y="0" width="128" height="40" fill="#ef7d57"/>
  <rect x="0" y="0" width="128" height="6" fill="#b13e53"/>
  <rect x="0" y="6" width="128" height="6" fill="#ef7d57"/>
  <rect x="0" y="12" width="128" height="6" fill="#ffcd75"/>

  <!-- Soleil bas -->
  <rect x="108" y="8" width="8" height="6" fill="#fff2c8"/>
  <rect x="110" y="7" width="4" height="8" fill="#fff2c8"/>

  <!-- Gradins de l'arène (fond) -->
  <rect x="0" y="16" width="128" height="8" fill="#5d275d"/>
  <rect x="0" y="16" width="128" height="1" fill="#b13e53"/>
  <rect x="4" y="18" width="2" height="2" fill="#ffcd75"/>
  <rect x="14" y="19" width="2" height="2" fill="#94b0c2"/>
  <rect x="24" y="18" width="2" height="2" fill="#a7f070"/>
  <rect x="34" y="19" width="2" height="2" fill="#73eff7"/>
  <rect x="44" y="18" width="2" height="2" fill="#ffcd75"/>
  <rect x="84" y="19" width="2" height="2" fill="#94b0c2"/>
  <rect x="94" y="18" width="2" height="2" fill="#a7f070"/>
  <rect x="104" y="19" width="2" height="2" fill="#73eff7"/>
  <rect x="114" y="18" width="2" height="2" fill="#ffcd75"/>

  <!-- Sable de l'arène -->
  <rect x="0" y="24" width="128" height="16" fill="#ffcd75"/>
  <rect x="0" y="24" width="128" height="1" fill="#fff2c8"/>
  <rect x="20" y="30" width="2" height="1" fill="#ef7d57"/>
  <rect x="70" y="34" width="2" height="1" fill="#ef7d57"/>
  <rect x="110" y="31" width="2" height="1" fill="#ef7d57"/>

  <!-- Barres en cours de tri au centre (la passe de bulles !) -->
  <rect x="52" y="36" width="26" height="1" fill="#566c86"/>
  <rect x="53" y="30" width="3" height="6" fill="#38b764"/>
  <rect x="57" y="33" width="3" height="3" fill="#a7f070"/>
  <rect x="61" y="27" width="3" height="9" fill="#b13e53"/>
  <rect x="65" y="31" width="3" height="5" fill="#ef7d57"/>
  <rect x="69" y="29" width="3" height="7" fill="#3b5dc9"/>
  <rect x="73" y="34" width="3" height="2" fill="#73eff7"/>
  <rect x="62" y="24" width="9" height="1" fill="#f4f4f4"/>          <!-- flèche d'échange -->
  <rect x="61" y="25" width="1" height="1" fill="#f4f4f4"/>
  <rect x="71" y="25" width="1" height="1" fill="#f4f4f4"/>

  <!-- Combattant arbitre (gauche) -->
  <rect x="30" y="26" width="4" height="1" fill="#b13e53"/>
  <rect x="30" y="27" width="4" height="2" fill="#ffcd75"/>
  <rect x="29" y="29" width="6" height="4" fill="#ef7d57"/>
  <rect x="27" y="25" width="1" height="8" fill="#94b0c2"/>
  <rect x="27" y="24" width="1" height="1" fill="#f4f4f4"/>
  <rect x="30" y="33" width="1" height="3" fill="#333c57"/>
  <rect x="33" y="33" width="1" height="3" fill="#333c57"/>

  <!-- Podium (droite) -->
  <rect x="94" y="34" width="22" height="2" fill="#333c57"/>
  <rect x="96" y="30" width="6" height="4" fill="#94b0c2"/>
  <rect x="102" y="27" width="6" height="7" fill="#ffcd75"/>
  <rect x="108" y="32" width="6" height="2" fill="#ef7d57"/>
  <rect x="104" y="25" width="2" height="2" fill="#fff2c8"/>          <!-- coupe -->

  <!-- Fanions -->
  <rect x="8" y="24" width="1" height="8" fill="#566c86"/>
  <rect x="9" y="24" width="3" height="2" fill="#b13e53"/>
  <rect x="120" y="24" width="1" height="8" fill="#566c86"/>
  <rect x="117" y="24" width="3" height="2" fill="#3b5dc9"/>
</svg>
