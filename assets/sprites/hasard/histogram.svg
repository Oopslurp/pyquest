<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- La distribution des sommes de deux dés : 7 est la plus fréquente -->
  <rect x="1" y="12" width="1" height="2" fill="#38b764"/>
  <rect x="3" y="10" width="1" height="4" fill="#38b764"/>
  <rect x="5" y="8" width="1" height="6" fill="#a7f070"/>
  <rect x="7" y="4" width="2" height="10" fill="#ffcd75"/>
  <rect x="7" y="4" width="2" height="1" fill="#fff2c8"/>
  <rect x="10" y="8" width="1" height="6" fill="#a7f070"/>
  <rect x="12" y="10" width="1" height="4" fill="#38b764"/>
  <rect x="14" y="12" width="1" height="2" fill="#38b764"/>

  <rect x="0" y="14" width="16" height="1" fill="#94b0c2"/>
  <rect x="7" y="1" width="2" height="2" fill="#b13e53"/>   <!-- le 7, gagnant -->
