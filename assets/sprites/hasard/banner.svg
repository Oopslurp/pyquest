<svg xmlns="http://www.w3.org/2000/svg" width="128" height="40" viewBox="0 0 128 40" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- La Taverne du Hasard : deux dés sur la table, et la distribution qui se dessine -->
  <rect x="0" y="0" width="128" height="40" fill="#1a1c2c"/>
  <rect x="0" y="0" width="128" height="14" fill="#29366f"/>
  <rect x="0" y="14" width="128" height="4" fill="#5d275d"/>

  <!-- poutres et lanternes de la taverne -->
  <rect x="0" y="0" width="128" height="3" fill="#333c57"/>
  <rect x="18" y="3" width="2" height="5" fill="#566c86"/>
  <rect x="15" y="8" width="8" height="6" fill="#ffcd75"/>
  <rect x="16" y="9" width="6" height="4" fill="#fff2c8"/>
  <rect x="104" y="3" width="2" height="5" fill="#566c86"/>
  <rect x="101" y="8" width="8" height="6" fill="#ffcd75"/>
  <rect x="102" y="9" width="6" height="4" fill="#fff2c8"/>

  <!-- table -->
  <rect x="0" y="30" width="128" height="10" fill="#5d275d"/>
  <rect x="0" y="30" width="128" height="2" fill="#b13e53"/>

  <!-- dé de gauche (face 5) -->
  <rect x="14" y="18" width="12" height="12" fill="#f4f4f4"/>
  <rect x="14" y="18" width="12" height="1" fill="#fff2c8"/>
  <rect x="25" y="18" width="1" height="12" fill="#94b0c2"/>
  <rect x="16" y="20" width="2" height="2" fill="#b13e53"/>
  <rect x="22" y="20" width="2" height="2" fill="#b13e53"/>
  <rect x="19" y="23" width="2" height="2" fill="#1a1c2c"/>
  <rect x="16" y="26" width="2" height="2" fill="#b13e53"/>
  <rect x="22" y="26" width="2" height="2" fill="#b13e53"/>

  <!-- dé de droite (face 2) -->
  <rect x="30" y="18" width="12" height="12" fill="#f4f4f4"/>
  <rect x="30" y="18" width="12" height="1" fill="#fff2c8"/>
  <rect x="41" y="18" width="1" height="12" fill="#94b0c2"/>
  <rect x="32" y="20" width="2" height="2" fill="#1a1c2c"/>
  <rect x="38" y="26" width="2" height="2" fill="#1a1c2c"/>

  <!-- la distribution des sommes : le 7 domine -->
  <rect x="56" y="28" width="4" height="2" fill="#38b764"/>
  <rect x="62" y="26" width="4" height="4" fill="#38b764"/>
  <rect x="68" y="23" width="4" height="7" fill="#38b764"/>
  <rect x="74" y="20" width="4" height="10" fill="#a7f070"/>
  <rect x="80" y="17" width="4" height="13" fill="#a7f070"/>
  <rect x="86" y="13" width="4" height="17" fill="#ffcd75"/>
  <rect x="86" y="13" width="4" height="1" fill="#fff2c8"/>
  <rect x="92" y="17" width="4" height="13" fill="#a7f070"/>
  <rect x="98" y="20" width="4" height="10" fill="#a7f070"/>
  <rect x="104" y="23" width="4" height="7" fill="#38b764"/>
  <rect x="110" y="26" width="4" height="4" fill="#38b764"/>
  <rect x="116" y="28" width="4" height="2" fill="#38b764"/>

  <!-- le 7, sommet de la courbe -->
  <rect x="86" y="8" width="4" height="3" fill="#b13e53"/>
  <rect x="87" y="9" width="2" height="1" fill="#fff2c8"/>
</svg>
