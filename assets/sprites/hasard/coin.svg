<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pile ou face : l'épreuve de Bernoulli -->
  <rect x="5" y="1" width="6" height="1" fill="#ffcd75"/>
  <rect x="3" y="2" width="10" height="2" fill="#ffcd75"/>
  <rect x="2" y="4" width="12" height="8" fill="#ffcd75"/>
  <rect x="3" y="12" width="10" height="2" fill="#ffcd75"/>
  <rect x="5" y="14" width="6" height="1" fill="#ffcd75"/>

  <!-- lumière et ombre -->
  <rect x="5" y="2" width="4" height="1" fill="#fff2c8"/>
  <rect x="3" y="3" width="2" height="1" fill="#fff2c8"/>
  <rect x="3" y="12" width="8" height="1" fill="#ef7d57"/>
  <rect x="11" y="10" width="2" height="2" fill="#ef7d57"/>

  <!-- la pièce est à moitié claire, à moitié sombre : deux issues -->
  <rect x="7" y="4" width="1" height="8" fill="#ef7d57"/>
  <rect x="9" y="6" width="3" height="1" fill="#b13e53"/>
  <rect x="4" y="9" width="3" height="1" fill="#b13e53"/>
</svg>
