<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Le registre déroulé : une ligne = une fiche, la colonne rouge = les clés -->
  <rect x="2" y="1" width="12" height="2" fill="#ffcd75"/>  <!-- rouleau haut -->
  <rect x="2" y="2" width="12" height="1" fill="#ef7d57"/>
  <rect x="3" y="3" width="10" height="10" fill="#fff2c8"/> <!-- parchemin -->
  <rect x="3" y="3" width="10" height="1" fill="#f4f4f4"/>
  <rect x="2" y="13" width="12" height="2" fill="#ffcd75"/> <!-- rouleau bas -->
  <rect x="2" y="14" width="12" height="1" fill="#ef7d57"/>

  <!-- colonne des clés -->
  <rect x="4" y="5" width="1" height="1" fill="#b13e53"/>
  <rect x="4" y="7" width="1" height="1" fill="#b13e53"/>
  <rect x="4" y="9" width="1" height="1" fill="#b13e53"/>
  <rect x="4" y="11" width="1" height="1" fill="#b13e53"/>
  <!-- lignes de valeurs -->
  <rect x="6" y="5" width="6" height="1" fill="#566c86"/>
  <rect x="6" y="7" width="4" height="1" fill="#566c86"/>
  <rect x="6" y="9" width="6" height="1" fill="#566c86"/>
  <rect x="6" y="11" width="3" height="1" fill="#566c86"/>
</svg>
