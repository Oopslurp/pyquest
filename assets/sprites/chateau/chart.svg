<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Histogramme des récoltes + ligne pointillée de la moyenne -->
  <rect x="2" y="2" width="1" height="12" fill="#94b0c2"/>  <!-- axe vertical -->
  <rect x="2" y="13" width="12" height="1" fill="#94b0c2"/> <!-- axe horizontal -->

  <rect x="4" y="8" width="2" height="5" fill="#38b764"/>
  <rect x="4" y="8" width="2" height="1" fill="#a7f070"/>
  <rect x="7" y="5" width="2" height="8" fill="#3b5dc9"/>
  <rect x="7" y="5" width="2" height="1" fill="#41a6f6"/>
  <rect x="10" y="10" width="2" height="3" fill="#ef7d57"/>
  <rect x="10" y="10" width="2" height="1" fill="#ffcd75"/>

  <!-- la moyenne -->
  <rect x="3" y="7" width="1" height="1" fill="#b13e53"/>
  <rect x="5" y="7" width="1" height="1" fill="#b13e53"/>
  <rect x="7" y="7" width="1" height="1" fill="#b13e53"/>
  <rect x="9" y="7" width="1" height="1" fill="#b13e53"/>
  <rect x="11" y="7" width="1" height="1" fill="#b13e53"/>
  <rect x="13" y="7" width="1" height="1" fill="#b13e53"/>
</svg>
