<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Le scribe des archives (fiche dans une main, plume dans l'autre) -->
  <rect x="6" y="2" width="4" height="1" fill="#333c57"/>  <!-- capuche -->
  <rect x="6" y="3" width="4" height="3" fill="#ffcd75"/>  <!-- visage -->
  <rect x="7" y="4" width="1" height="1" fill="#1a1c2c"/>  <!-- oeil G -->
  <rect x="9" y="4" width="1" height="1" fill="#1a1c2c"/>  <!-- oeil D -->
  <rect x="5" y="6" width="6" height="5" fill="#5d275d"/>  <!-- robe d'archiviste -->
  <rect x="5" y="6" width="6" height="1" fill="#b13e53"/>
  <rect x="4" y="6" width="1" height="4" fill="#5d275d"/>  <!-- bras G -->
  <rect x="11" y="6" width="1" height="4" fill="#5d275d"/> <!-- bras D -->
  <rect x="1" y="8" width="3" height="3" fill="#fff2c8"/>  <!-- fiche tenue -->
  <rect x="2" y="9" width="1" height="1" fill="#566c86"/>
  <rect x="12" y="5" width="1" height="4" fill="#f4f4f4"/> <!-- plume -->
  <rect x="12" y="4" width="1" height="1" fill="#73eff7"/>
  <rect x="6" y="11" width="1" height="3" fill="#333c57"/> <!-- jambe G -->
  <rect x="9" y="11" width="1" height="3" fill="#333c57"/> <!-- jambe D -->
</svg>
