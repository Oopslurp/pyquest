<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Le franchissement du seuil : la flèche traverse la ligne dorée -->
  <rect x="0" y="8" width="2" height="1" fill="#ffcd75"/>
  <rect x="3" y="8" width="2" height="1" fill="#ffcd75"/>
  <rect x="6" y="8" width="2" height="1" fill="#ffcd75"/>
  <rect x="9" y="8" width="2" height="1" fill="#ffcd75"/>
  <rect x="12" y="8" width="2" height="1" fill="#ffcd75"/>
  <rect x="15" y="8" width="1" height="1" fill="#ffcd75"/>

  <rect x="7" y="2" width="2" height="12" fill="#73eff7"/>  <!-- hampe -->
  <rect x="6" y="4" width="1" height="1" fill="#73eff7"/>   <!-- barbes -->
  <rect x="9" y="4" width="1" height="1" fill="#73eff7"/>
  <rect x="5" y="5" width="1" height="1" fill="#41a6f6"/>
  <rect x="10" y="5" width="1" height="1" fill="#41a6f6"/>
  <rect x="7" y="1" width="2" height="1" fill="#f4f4f4"/>   <!-- pointe -->
</svg>
