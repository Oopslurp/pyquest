<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- L'astronome du royaume, celui qui relève les termes nuit après nuit -->
  <rect x="7" y="0" width="2" height="1" fill="#29366f"/>  <!-- chapeau pointu -->
  <rect x="6" y="1" width="4" height="1" fill="#29366f"/>
  <rect x="5" y="2" width="6" height="1" fill="#29366f"/>
  <rect x="6" y="1" width="1" height="1" fill="#ffcd75"/>  <!-- étoile brodée -->

  <rect x="6" y="3" width="4" height="3" fill="#ffcd75"/>   <!-- visage -->
  <rect x="7" y="4" width="1" height="1" fill="#1a1c2c"/>
  <rect x="9" y="4" width="1" height="1" fill="#1a1c2c"/>

  <rect x="5" y="6" width="6" height="5" fill="#29366f"/>   <!-- robe étoilée -->
  <rect x="5" y="6" width="6" height="1" fill="#3b5dc9"/>
  <rect x="6" y="8" width="1" height="1" fill="#73eff7"/>
  <rect x="9" y="9" width="1" height="1" fill="#73eff7"/>

  <rect x="4" y="6" width="1" height="4" fill="#29366f"/>   <!-- bras G -->
  <rect x="11" y="6" width="1" height="3" fill="#29366f"/>  <!-- bras D -->

  <rect x="11" y="4" width="4" height="2" fill="#94b0c2"/>  <!-- longue-vue -->
  <rect x="11" y="4" width="4" height="1" fill="#f4f4f4"/>
  <rect x="15" y="3" width="1" height="3" fill="#73eff7"/>

  <rect x="6" y="11" width="1" height="3" fill="#333c57"/>
  <rect x="9" y="11" width="1" height="3" fill="#333c57"/>
</svg>
