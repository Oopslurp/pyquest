<svg xmlns="http://www.w3.org/2000/svg" width="128" height="40" viewBox="0 0 128 40" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid slice">
  <!-- Nuit claire sur le Chemin des Suites : les rangs montent vers le seuil doré -->
  <rect x="0" y="0" width="128" height="40" fill="#1a1c2c"/>
  <rect x="0" y="10" width="128" height="8" fill="#29366f"/>
  <rect x="0" y="18" width="128" height="6" fill="#3b5dc9"/>
  <rect x="0" y="24" width="128" height="4" fill="#5d275d"/>

  <!-- étoiles -->
  <rect x="12" y="4" width="1" height="1" fill="#f4f4f4"/>
  <rect x="34" y="7" width="1" height="1" fill="#73eff7"/>
  <rect x="52" y="3" width="1" height="1" fill="#f4f4f4"/>
  <rect x="70" y="6" width="1" height="1" fill="#94b0c2"/>
  <rect x="96" y="2" width="1" height="1" fill="#f4f4f4"/>
  <rect x="114" y="9" width="1" height="1" fill="#73eff7"/>
  <rect x="24" y="13" width="1" height="1" fill="#94b0c2"/>
  <rect x="86" y="12" width="1" height="1" fill="#f4f4f4"/>

  <!-- sol -->
  <rect x="0" y="34" width="128" height="6" fill="#333c57"/>
  <rect x="0" y="34" width="128" height="1" fill="#566c86"/>

  <!-- l'escalier des rangs : chaque colonne est un terme, de plus en plus haut -->
  <rect x="10" y="30" width="10" height="4" fill="#566c86"/>
  <rect x="10" y="30" width="10" height="1" fill="#94b0c2"/>
  <rect x="22" y="27" width="10" height="7" fill="#566c86"/>
  <rect x="22" y="27" width="10" height="1" fill="#94b0c2"/>
  <rect x="34" y="23" width="10" height="11" fill="#566c86"/>
  <rect x="34" y="23" width="10" height="1" fill="#94b0c2"/>
  <rect x="46" y="19" width="10" height="15" fill="#566c86"/>
  <rect x="46" y="19" width="10" height="1" fill="#94b0c2"/>
  <rect x="58" y="15" width="10" height="19" fill="#566c86"/>
  <rect x="58" y="15" width="10" height="1" fill="#94b0c2"/>
  <rect x="70" y="12" width="10" height="22" fill="#566c86"/>
  <rect x="70" y="12" width="10" height="1" fill="#94b0c2"/>

  <!-- la ligne de seuil -->
  <rect x="0" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="6" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="12" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="18" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="24" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="30" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="36" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="42" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="48" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="54" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="60" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="66" y="10" width="4" height="1" fill="#ffcd75"/>
  <rect x="72" y="10" width="4" height="1" fill="#ffcd75"/>

  <!-- la première colonne qui franchit le seuil -->
  <rect x="82" y="6" width="10" height="28" fill="#73eff7"/>
  <rect x="82" y="6" width="10" height="1" fill="#f4f4f4"/>
  <rect x="94" y="3" width="10" height="31" fill="#73eff7"/>
  <rect x="94" y="3" width="10" height="1" fill="#f4f4f4"/>

  <!-- l'astronome qui relève les mesures -->
  <rect x="115" y="20" width="4" height="1" fill="#29366f"/>
  <rect x="114" y="21" width="6" height="1" fill="#29366f"/>
  <rect x="115" y="22" width="4" height="3" fill="#ffcd75"/>
  <rect x="116" y="23" width="1" height="1" fill="#1a1c2c"/>
  <rect x="118" y="23" width="1" height="1" fill="#1a1c2c"/>
  <rect x="114" y="25" width="6" height="6" fill="#29366f"/>
  <rect x="114" y="25" width="6" height="1" fill="#3b5dc9"/>
  <rect x="120" y="23" width="5" height="2" fill="#94b0c2"/>
  <rect x="125" y="22" width="1" height="3" fill="#73eff7"/>
  <rect x="115" y="31" width="1" height="3" fill="#333c57"/>
  <rect x="118" y="31" width="1" height="3" fill="#333c57"/>
</svg>
