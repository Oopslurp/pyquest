<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- L'escalier des rangs : chaque marche est un terme, la ligne dorée est le seuil -->
  <rect x="1" y="12" width="3" height="2" fill="#566c86"/>
  <rect x="1" y="12" width="3" height="1" fill="#94b0c2"/>
  <rect x="4" y="10" width="3" height="4" fill="#566c86"/>
  <rect x="4" y="10" width="3" height="1" fill="#94b0c2"/>
  <rect x="7" y="8" width="3" height="6" fill="#566c86"/>
  <rect x="7" y="8" width="3" height="1" fill="#94b0c2"/>
  <rect x="10" y="5" width="3" height="9" fill="#566c86"/>
  <rect x="10" y="5" width="3" height="1" fill="#94b0c2"/>

  <!-- la ligne de seuil, pointillée -->
  <rect x="0" y="3" width="2" height="1" fill="#ffcd75"/>
  <rect x="3" y="3" width="2" height="1" fill="#ffcd75"/>
  <rect x="6" y="3" width="2" height="1" fill="#ffcd75"/>
  <rect x="9" y="3" width="2" height="1" fill="#ffcd75"/>

  <!-- la dernière marche franchit le seuil -->
  <rect x="13" y="1" width="3" height="13" fill="#73eff7"/>
  <rect x="13" y="1" width="3" height="1" fill="#f4f4f4"/>

  <rect x="0" y="14" width="16" height="2" fill="#333c57"/>
</svg>
