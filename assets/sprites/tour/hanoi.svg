<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Tours de Hanoï (le boss du monde) -->
  <rect x="1" y="13" width="14" height="1" fill="#566c86"/>           <!-- socle -->
  <rect x="3" y="6" width="1" height="7" fill="#94b0c2"/>             <!-- piquet 1 -->
  <rect x="8" y="6" width="1" height="7" fill="#94b0c2"/>             <!-- piquet 2 -->
  <rect x="13" y="6" width="1" height="7" fill="#94b0c2"/>            <!-- piquet 3 -->
  <rect x="1" y="12" width="5" height="1" fill="#b13e53"/>            <!-- grand disque -->
  <rect x="2" y="11" width="3" height="1" fill="#ef7d57"/>            <!-- moyen disque -->
  <rect x="3" y="10" width="1" height="1" fill="#ffcd75"/>            <!-- petit disque -->
  <rect x="12" y="12" width="3" height="1" fill="#38b764"/>           <!-- disque déjà déplacé -->
</svg>
