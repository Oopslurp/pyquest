<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Le Mage de la tour -->
  <rect x="7" y="1" width="2" height="1" fill="#5d275d"/>  <!-- pointe du chapeau -->
  <rect x="6" y="2" width="4" height="1" fill="#5d275d"/>
  <rect x="5" y="3" width="6" height="1" fill="#5d275d"/>
  <rect x="9" y="2" width="1" height="1" fill="#ffcd75"/>  <!-- étoile du chapeau -->
  <rect x="6" y="4" width="4" height="2" fill="#ffcd75"/>  <!-- visage -->
  <rect x="7" y="4" width="1" height="1" fill="#1a1c2c"/>  <!-- oeil G -->
  <rect x="9" y="4" width="1" height="1" fill="#1a1c2c"/>  <!-- oeil D -->
  <rect x="6" y="6" width="4" height="1" fill="#f4f4f4"/>  <!-- barbe -->
